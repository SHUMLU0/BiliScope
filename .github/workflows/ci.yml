name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # 真实网络 smoke test 不进常规流水线，需要时手动触发
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # P1-10：pnpm test 已排除 tests/smoke/**，CI 全程离线、结果确定
      - name: Unit tests (offline)
        run: pnpm test

      - name: Assert smoke tests are not part of the default run
        run: node scripts/assert-smoke-isolated.mjs

      - name: Build (CRX)
        run: pnpm build

      - name: Secret scan
        run: node scripts/scan-secrets.mjs

      - name: Upload CRX artifact
        uses: actions/upload-artifact@v4
        with:
          name: biliscope-dist
          path: dist/
          if-no-files-found: warn
          retention-days: 14

  # 只在手动触发时跑，避免 CI 频繁打真实 B 站接口
  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Real API smoke (hits api.bilibili.com)
        run: pnpm test:smoke
        continue-on-error: true